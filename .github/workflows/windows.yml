name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned rclone for integration tests
        shell: pwsh
        run: |
          $version = "v1.76.0"
          $name = "rclone-$version-windows-amd64.zip"
          $base = "https://github.com/rclone/rclone/releases/download/$version"
          $archive = Join-Path $env:RUNNER_TEMP $name
          $checksums = Join-Path $env:RUNNER_TEMP "rclone-SHA256SUMS"
          Invoke-WebRequest "$base/$name" -OutFile $archive
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile $checksums
          $line = Get-Content $checksums | Where-Object { $_ -match "\s+$([regex]::Escape($name))$" } | Select-Object -First 1
          if (-not $line) { throw "No SHA-256 entry for $name" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "rclone archive SHA-256 mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "rclone"
          Expand-Archive $archive $extract -Force
          $rclone = Get-ChildItem $extract -Recurse -Filter rclone.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $rclone) { throw "rclone.exe was not found in the archive" }
          "RCLONE_EXE=$rclone" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application and tests
        run: cmd /c .\build.bat

      - name: Run unit and real-rclone integration tests
        env:
          RCLONE_LITE_TEST_TASK_SCHEDULER: "1"
        run: ctest --test-dir build --output-on-failure

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --yes --no-progress

      - name: Build installer and checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\installer\build-installer.ps1
          $installer = Get-ChildItem .\dist -Filter "RcloneLite-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not generated" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: RcloneLite-installer
          path: |
            dist/RcloneLite-Setup-*.exe
            dist/RcloneLite-Setup-*.exe.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: RcloneLite-installer
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          gh release create $env:GITHUB_REF_NAME `
            ".\release-assets\RcloneLite-Setup-$version.exe" `
            ".\release-assets\RcloneLite-Setup-$version.exe.sha256" `
            --title "Rclone Lite $version" `
            --notes-file .\RELEASE_NOTES.md
